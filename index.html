<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuizArena — Classroom Game Hub</title>
  <meta name="description" content="All-in-one classroom quiz game hub: spin, guess image, word, opposites, wrong-answer-only & more. Works offline!" />
  <meta name="theme-color" content="#05070f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- LaTeX (online থাকলে সুন্দর math দেখাবে, offline হলে সাধারণ text) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <!-- ☁️ Firebase চাইলে: config দেওয়ার পর নিচের ২ লাইন uncomment করো
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  -->
</head>
<body>
  <header class="topbar">
    <button class="logo" data-nav="home" title="Home">
      <span class="logo-mark">🎮</span>
      <span class="logo-text">Quiz<b>Arena</b></span>
    </button>
    <nav class="topnav">
      <button data-nav="home">Games</button>
      <button data-nav="packs">Question Packs</button>
      <button data-nav="images">Image Lab</button>
      <button data-nav="settings">Settings</button>
    </nav>
    <button id="btn-sound" class="icon-btn" title="Sound on/off">🔊</button>
  </header>

  <main id="view" class="view"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/db.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script>
/* games-ready event হলে app start করো */
window.addEventListener('games-ready', function() {
  if (window.App) App.start();
});
</script>
  </body>
</html>
