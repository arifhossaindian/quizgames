<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuizArena — Classroom Game Hub</title>
  <meta name="description" content="All-in-one classroom quiz game hub: spin the roll, guess the image, guess the word, wrong-answer-only, opposites & more." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- ☁️ OPTIONAL Firebase cloud sync: js/firebase-config.js এ config দেওয়ার পর এই দুটো লাইন uncomment করো
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  -->
</head>
<body>
  <header class="topbar">
    <button class="logo" data-nav="home" title="Home">
      <span class="logo-mark">🎮</span>
      <span class="logo-text">Quiz<b>Arena</b></span>
    </button>
    <nav class="topnav">
      <button data-nav="home">Games</button>
      <button data-nav="packs">Question Packs</button>
      <button data-nav="images">Image Lab</button>
      <button data-nav="settings">Settings</button>
    </nav>
    <button id="btn-sound" class="icon-btn" title="Sound on/off">🔊</button>
  </header>

  <main id="view" class="view"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/db.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
